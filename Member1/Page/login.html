<!DOCTYPE html>
<html lang="en-US">
    <head>
        <meta charset="UTF-8">
        <title> Login | SmartFit </title>
        <link rel="stylesheet" href="../Design/style.css">
        <link rel="stylesheet" href="../Design/member1.css">
    </head>
    <body>
        <img src="../Images/logo.png" id="logo" alt="SmartFit logo">
        <h1> Login to SmartFit </h1>

        <div class="topnav">
            <a href="../index.html"> Home </a>
            <a href="login.html"> Login </a>
            <a href="signup.html"> Sign Up </a>
            <a href="profile.html"> Profile </a>
            <a href="forgot-password.html"> Forgot Password </a>
        </div>

        <form action="profile.html" onsubmit="return collect_data()">
            <fieldset>
                <legend> Login Information </legend>
                <table>
                    <tr>
                        <td> <label for="UserEmail"> Email: </label> </td>
                        <td>
                            <input type="email" id="UserEmail" name="UserEmail" placeholder="Enter the Email">
                            <span id="EmailError" style="color:red"></span>
                        </td>
                    </tr>
                    <tr>
                        <td> <label for="Password"> Password: </label> </td>
                        <td>
                            <input type="password" id="Password" name="Password" placeholder="Enter the Password">
                            <span id="PasswordError" style="color:red"></span>
                        </td>
                    </tr>
                </table>
            </fieldset>
            <br>
            <input type="submit" id="submit" value="Login">
            <input type="reset" id="reset">
        </form>

        <p> New here? <a href="signup.html"> Create an account </a> </p>

        <script src="../JS/member1.js"></script>
    </body>
</html>
