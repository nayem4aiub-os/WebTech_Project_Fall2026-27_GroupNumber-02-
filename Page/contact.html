<!DOCTYPE html>
<html lang="en-US">
    <head>
        <meta charset="UTF-8">
        <title> Contact | SmartFit </title>
        <link rel="stylesheet" href="../Design/style.css">
        <link rel="stylesheet" href="../Design/member4.css">
    </head>
    <body>
        <img src="../Images/logo.png" id="logo" alt="SmartFit logo">
        <h1> Contact Us </h1>

        <div class="topnav">
            <a href="../index.html"> Home </a>
            <a href="progress.html"> Progress </a>
            <a href="admin.html"> Admin </a>
            <a href="contact.html"> Contact </a>
            <a href="feedback.html"> Feedback </a>
        </div>

        <form action="../index.html" onsubmit="return collect_data()">
            <fieldset>
                <legend> Send Us a Message </legend>
                <table>
                    <tr>
                        <td> <label for="FullName"> Full Name: </label> </td>
                        <td>
                            <input type="text" id="FullName" name="FullName" placeholder="Enter Your Name">
                            <span id="ErrorText" style="color:red"></span>
                        </td>
                    </tr>
                    <tr>
                        <td> <label for="UserEmail"> Email: </label> </td>
                        <td>
                            <input type="email" id="UserEmail" name="UserEmail" placeholder="Enter the Email">
                            <span id="EmailError" style="color:red"></span>
                        </td>
                    </tr>
                    

                    <tr>
                        <td> <label for="Message"> Message: </label> </td>
                        <td>
                            <textarea id="Message" name="Message" placeholder="Write your message" rows="5" cols="30" required></textarea>
                            <span id="MessageError" style="color:red"></span>
                        </td>
                    </tr>
                </table>
            </fieldset>
            <br>
            <input type="submit" id="submit" value="Send Message">
            <input type="reset" id="reset">
        </form>

        <fieldset>
            <legend> Your Message </legend>
            <p id="contactResult"> Your message will appear here after you send it. </p>
        </fieldset>

        <script src="../JS/member4.js"></script>
    </body>
</html>
