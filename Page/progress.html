<!DOCTYPE html>
<html lang="en-US">
    <head>
        <meta charset="UTF-8">
        <title> Progress | SmartFit </title>
        <link rel="stylesheet" href="../Design/style.css">
        <link rel="stylesheet" href="../Design/member4.css">
    </head>
    <body>
        <img src="../Images/logo.png" id="logo" alt="SmartFit logo">
        <h1> Progress Dashboard </h1>

        <div class="topnav">
            <a href="../index.html"> Home </a>
            <a href="progress.html"> Progress </a>
            <a href="admin.html"> Admin </a>
            <a href="contact.html"> Contact </a>
            <a href="feedback.html"> Feedback </a>
        </div>

        <fieldset>
            <legend> Your Journey </legend>
            <table>
                <tr>
                    <td> <b> Current BMI </b> </td>
                    <td id="bmiResult"> Enter your measurements below </td>
                </tr>
                <tr>
                    <td> <b> Workouts completed </b> </td>
                    <td> 3 </td>
                </tr>
                <tr>
                    <td> <b> Calories logged </b> </td>
                    <td> 1100 kcal </td>
                </tr>
            </table>
        </fieldset>

        <form onsubmit="return collect_data()">
            <fieldset>
                <legend> Record Weight </legend>
                <table>
                    <tr>
                        <td> <label for="heightInput"> Height (cm): </label> </td>
                        <td> <input type="number" id="heightInput" name="heightInput" min="1" placeholder="e.g. 170" required> </td>
                    </tr>
                    <tr>
                        <td> <label for="weightInput"> Weight (kg): </label> </td>
                        <td> <input type="number" id="weightInput" name="weightInput" min="1" step="0.1" placeholder="e.g. 68" required> </td>
                    </tr>
                </table>
            </fieldset>
            <br>
            <input type="submit" id="submit" value="Save Weight">
            <input type="reset" id="reset">
        </form>

        <fieldset>
            <legend> Weight History </legend>
            <table border="1">
                <tr>
                    <td> <b> Weight </b> </td>
                    <td> <b> Date </b> </td>
                </tr>
                <tr>
                    <td> 68 kg </td>
                    <td> 30/10/2026 </td>
                </tr>
                <tr>
                    <td> 69 kg </td>
                    <td> 23/10/2026 </td>
                </tr>
                <tr>
                    <td> 70 kg </td>
                    <td> 16/10/2026 </td>
                </tr>
            </table>
        </fieldset>

        <script src="../JS/member4.js"></script>
    </body>
</html>
